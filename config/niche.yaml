target_personas:
  - name: "Agency owner"
    description: "Runs a marketing, insurance, or real estate agency; wants delivery capacity and margin without adding headcount or depending on a few key people."
    priority_level: primary
  - name: "SMB operator"
    description: "Founder or COO of a $1M to $50M business evaluating where AI agents pay off and what they really cost."
    priority_level: primary
  - name: "Marketing leader"
    description: "CMO or head of growth who needs ROI visibility across channels and a lean, AI-assisted team."
    priority_level: secondary
  - name: "Operations or support lead"
    description: "Owns ticket queues, intake, scheduling, or reporting and wants fewer manual handoffs with clear escalation."
    priority_level: secondary

