  - {term: "ai agent evaluation", intent: informational, pillar: "Data, reporting, and strategy simulation"}
  - {term: "ai agents vs offshore team", intent: commercial, pillar: "AI ROI and operating cost"}
  - {term: "bpo vs ai automation cost", intent: commercial, pillar: "AI ROI and operating cost"}
  - {term: "ai automation roi calculator", intent: commercial, pillar: "AI ROI and operating cost"}
  - {term: "reduce software costs with ai", intent: commercial, pillar: "AI ROI and operating cost"}
  - {term: "ai cmo", intent: informational, pillar: "AI marketing operations"}
