trend_queries:
  - "AI agents"
  - "agentic workflows"
  - "n8n"
  - "LLM evaluation"
  - "AI automation business"
  - "AI marketing"

banned_topics:
  - "cryptocurrency trading"
  - "gambling"
  - "adult content"
  - "political campaigns"
  - "medical diagnosis advice"
  - "legal advice for specific cases"

prohibited_claims:
  - "Guaranteed rankings, revenue, savings, or ROI"
  - "Hallucination-free or error-free AI output"
  - "Fully autonomous agents that need no human oversight"
  - "Named clients, client logos, testimonials, or case results unless listed as a verified proof claim"
  - "Pitch-deck traction figures (revenue, GMV, valuation, customer counts)"
  - "Partner-network memberships unless listed as a verified proof claim"
  - "Specific prices for Entropy services"
  - "Compliance certifications (SOC 2, HIPAA, GDPR) for Entropy"

