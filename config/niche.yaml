# Entropy & Co. · Niche configuration
#
# Single source of truth for everything brand-specific. Every agent reads this at
# run time via entropyseo.config.load_niche_config(). Sources: entropyand.co public
# pages (sitemap, services) and the EnCo pitch deck (30 July).
#
# Rules for editing:
# - proof_claims reach prompts only when verified: true. Flip a claim only after
#   confirming it is public and approved for marketing use.
# - priority_keywords are seed hypotheses, not measured demand. Keyword research
#   expands and scores them; dedupe drops anything the site already covers.

brand_entity:
  name: "Entropy & Co."
  url: "https://entropyand.co/"
  positioning: >-
    Agentic AI infrastructure for de-risking operations, built for agencies and growing businesses:
    AI agents that act as a virtual workforce (execution), one dashboard and knowledge base for the
    whole organization (data), and strategy simulation that tests a plan before budget is spent (intelligence).
  description: >-
    An AI-native agency that designs and builds AI agents, workflow automation, connected marketing
    operations (SEO, content, email, paid ads), and custom AI and software, with human review points
    and measurable business goals. Offered as an enterprise suite, a done-with-you build-train-handoff
    engagement for SMEs and agencies, and self-serve SaaS.
  logo_url:
  contact_email:
  social_profiles: []
  service_areas: []
  proof_claims:
    # From the pitch deck. Unverified until confirmed public and approved; never shown to the writer while false.
    - claim: "Member of the Anthropic Claude Partner Network"
      verified: false
    - claim: "Member of the AWS Partner Network"
      verified: false
    - claim: "Part of Google for Startups"
      verified: false
    - claim: "Selected for the Perplexity AI Business Fellowship"
      verified: false
    - claim: "Co-built and deployed agent products including Obelisk (AI CMO), AgentSpace, and Anatomia"
      verified: false

pillars:
  - name: "AI agents and workflow automation"
    description: "Where agents beat rules, how to scope, build, test, and run automated workflows with human review."
    priority: 1
    service_url: "https://entropyand.co/services/ai-automation"
  - name: "AI for agencies"
    description: "De-risking agency operations: delivery capacity, client reporting, reducing key-person dependency, margins."
    priority: 2
    service_url: "https://entropyand.co/services/ai-automation"
  - name: "AI marketing operations"
    description: "An AI CMO approach: research-driven strategy, content, SEO, email, social, and paid ads run as one connected system."
    priority: 3
    service_url: "https://entropyand.co/services/digital-marketing"
  - name: "AI ROI and operating cost"
    description: "Cost math for agents versus offshore teams, BPO, operators, and software bloat; measuring what actually changed."
    priority: 4
    service_url: "https://entropyand.co/services/ai-automation"
  - name: "Data, reporting, and strategy simulation"
    description: "One source of truth for marketing and ops data, knowledge bases, evaluators, and testing strategies before spending."
    priority: 5
    service_url: "https://entropyand.co/services/ml-ai"
  - name: "Industry AI playbooks"
    description: "Vertical guides for dental, real estate, insurance, law firms, home services, healthcare, and other local businesses."
    priority: 6
    service_url: "https://entropyand.co/services/ai-automation"
  - name: "Custom AI and software builds"
    description: "When to build custom agents or software instead of stitching tools, and how to run the build safely."
    priority: 7
    service_url: "https://entropyand.co/services/software-development"

