voice:
  perspective: "first-person plural for Entropy's editorial view; second person for the reader"
  tone: "Senior operator talking to a peer: practical, numerate, calm, honest about tradeoffs. Sales-aware, never salesy."
  banned_characters: ["—", "–"]
  banned_phrases:
    - "in today's fast-paced world"
    - "game-changer"
    - "unlock the power"
    - "take your business to the next level"
    - "revolutionize"
    - "supercharge"
    - "cutting-edge"
    - "seamless"
    - "delve"
    - "hallucination-free"
  max_paragraph_length_sentences: 4
