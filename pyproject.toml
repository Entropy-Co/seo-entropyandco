[project]
name = "entropyseo"
version = "0.1.0"
description = "Entropy & Co. agentic SEO engine: research, plan, write, review, and publish to Framer CMS"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "UNLICENSED" }
authors = [{ name = "Entropy & Co." }]

dependencies = [
    "anthropic>=0.96.0",
    "openai>=3.19.0",
    "langgraph>=0.2.50",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.0",
    "markdown-it-py>=3.0.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-httplib2>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
entropyseo = "entropyseo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entropyseo"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/entropyseo/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
disable_error_code = ["no-any-return", "union-attr", "arg-type", "index", "call-overload", "type-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "markdown_it.*", "googleapiclient.*", "google.*", "google_auth_httplib2", "httplib2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["tests"]
